name: macOS adapter and shared renderer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/macos-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: macOS tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check macOS launch scripts
        run: |
          for script in start.sh 安装.sh 卸载.sh 启动.command; do
            bash -n "$script"
          done
      - name: Test adapter, timing and shared renderer with fixtures
        run: >-
          python -m unittest
          tests.test_macos tests.test_core tests.test_effect_parameters
          tests.test_glyph_motion tests.test_text_effects -v
